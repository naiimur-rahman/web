<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TA Portal - Apply</title>
    <link rel="stylesheet" href="apply.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="logo">TA PORTAL</div>

        <div class="student-info">
          <div class="profile-icon">T</div>
          <div>
            <div class="student-name">Tanjim Tazwar</div>
            <div class="student-id">011222146</div>
          </div>
        </div>

        <div class="menu">
          <a href="student_dashboard.html" class="menu-item">Dashboard</a>
          <a href="ta_position.html" class="menu-item">Available Positions</a>
          <a href="my_applications.html" class="menu-item">My Applications</a>
          <a href="student_profile.html" class="menu-item">My Profile</a>
          <a href="assigned_task.html" class="menu-item">Assigned Task</a>
          <a href="appointment_letter.html" class="menu-item">Appointment Letter</a>
        </div>

        <div class="logout">
          <a href="javascript:void(0)" onclick="logout()">Logout</a>
        </div>
      </div>

      <div class="main">
        <div class="page-header">
          <h1>TA Application</h1>
          <p>Submit your application for a TA position</p>
        </div>

        <div class="form-card">
          <h2>Apply for TA Position</h2>

          <p class="description">
            Complete the form below to apply for a teaching assistant position.
          </p>

          <form id="apply-form">
            <div class="form-group">
              <label>Select Position</label>
              <select id="vacancy-select" required>
                <option value="">Loading positions...</option>
              </select>
            </div>

            <div class="form-group">
              <label>Student Name</label>
              <input type="text" id="student-name" readonly />
            </div>

            <div class="form-group">
              <label>Student ID</label>
              <input type="text" id="student-uni-id" readonly />
            </div>

            <div class="form-group">
              <label>CGPA</label>
              <input type="text" id="student-cgpa" readonly />
            </div>

            <div class="form-group">
              <label>Why do you want to become a TA?</label>
              <textarea
                id="motivation"
                placeholder="Write your motivation..."
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label>Relevant Skills</label>
              <textarea
                id="skills"
                placeholder="Example: HTML, CSS, C++, SQL..."
                required
              ></textarea>
            </div>

            <div class="button-row">
              <a href="ta_position.html" class="cancel"> Cancel </a>
              <button type="submit" id="submit-btn">Submit Application</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="student.js"></script>
  </body>
</html>
